name: Deploy Coach Demo to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Prefix GitHub Pages asset paths
        run: |
          node <<'NODE'
          const fs = require('fs'), path = require('path');
          const root = 'dist/client', prefix = '/ai-body-coach-mvp';
          function walk(dir) {
            for (const ent of fs.readdirSync(dir, {withFileTypes:true})) {
              const p = path.join(dir, ent.name);
              if (ent.isDirectory()) walk(p);
              else {
                let s; try { s = fs.readFileSync(p, 'utf8'); } catch { continue; }
                s = s.replaceAll('/_next', prefix + '/_next')
                     .replaceAll('/favicon', prefix + '/favicon')
                     .replaceAll(prefix + prefix, prefix);
                fs.writeFileSync(p, s);
              }
            }
          }
          walk(root);
          NODE
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist/client
      - uses: actions/deploy-pages@v4
